<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>냥 캐치 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: 한 화면 아케이드 캐비닛 — 상단 HUD, 중앙 캔버스(터치/드래그), 오버레이로 시작/게임오버 */
:root{
  --bg:#1a0b3b; --bg2:#2d1066; --pink:#ff3d9a; --cyan:#2de2ff; --yellow:#ffd93d; --lime:#7dff5a; --ink:#fff6e0;
  --font-d:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-d);
  padding-block:8px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box; display:flex; justify-content:center; align-items:center;
  background-image:radial-gradient(var(--bg2) 1.5px,transparent 1.5px); background-size:22px 22px;
}
.cab{width:min(100%,420px); max-height:100%; display:flex; flex-direction:column; gap:10px; min-width:0}
.hud{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; line-height:1.6;
  background:#0d0524; border:4px solid var(--cyan); box-shadow:4px 4px 0 var(--pink); padding:10px 12px}
.hud b{display:block; font-weight:400}
.lab{color:var(--cyan); font-size:8px}
#score{color:var(--yellow); font-size:16px; font-variant-numeric:tabular-nums}
#hi{color:var(--lime); font-variant-numeric:tabular-nums}
#lv{color:var(--pink); font-size:16px}
.ov.clear{background:rgba(13,5,36,.6)}
#lives{color:var(--pink); font-size:16px; letter-spacing:2px; white-space:nowrap}
#lives .off{color:#4a2a6e}
.stage{position:relative; border:4px solid var(--yellow); box-shadow:4px 4px 0 var(--cyan); background:#000; line-height:0; min-height:0}
canvas{width:100%; height:auto; max-height:calc(100dvh - 190px); aspect-ratio:2/3; display:block; touch-action:none; image-rendering:pixelated; cursor:ew-resize; margin:0 auto; object-fit:contain}
.ov{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center;
  background:rgba(13,5,36,.86); line-height:1.6; padding:16px}
.ov h1{margin:0; font-size:22px; font-weight:400; color:var(--yellow); text-shadow:3px 3px 0 var(--pink); text-wrap:balance}
.ov p{margin:0; font-size:9px; line-height:2; color:var(--ink)}
.ov .big{font-size:18px; color:var(--lime)}
.legend{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; font-size:8px; color:var(--cyan)}
button,.file{font-family:var(--font-d); font-size:13px; color:#1a0b3b; background:var(--yellow); border:4px solid #fff6e0; padding:14px 18px; cursor:pointer;
  box-shadow:4px 4px 0 var(--pink); text-transform:uppercase}
button:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--pink)}
button:focus-visible,.file:focus-within{outline:3px solid var(--cyan); outline-offset:3px}
.file{font-size:8px; padding:8px 10px; background:var(--cyan); display:inline-block; box-shadow:3px 3px 0 var(--pink)}
.file input{position:absolute; width:1px; height:1px; opacity:0}
.foot{font-size:8px; color:var(--cyan); text-align:center; line-height:1.8}
.blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>

<div class="cab">
  <div class="hud">
    <div><span class="lab">SCORE</span><b id="score">0</b></div>
    <div><span class="lab">LEVEL</span><b id="lv">1</b></div>
    <div><span class="lab">HI</span><b id="hi">0</b></div>
    <div><span class="lab">LIFE</span><b id="lives"></b></div>
  </div>
  <div class="stage">
    <canvas id="c" width="360" height="540"></canvas>
    <div class="ov" id="start">
      <h1>NYANG<br>CATCH!</h1>
      <div class="legend"><span>APPLE +10</span><span style="color:var(--yellow)">GOLD +50</span><span style="color:var(--pink)">BOMB -20 &amp; LIFE</span></div>
      <p>← → 키 · 터치 · 드래그로<br>고양이를 움직이세요</p>
      <button id="btnStart">START</button>
      <label class="file">내 캐릭터 이미지<input type="file" id="file" accept="image/*"></label>
    </div>
    <div class="ov" id="over" hidden>
      <h1>GAME<br>OVER</h1>
      <p>FINAL SCORE</p>
      <div class="big" id="final">0</div>
      <p id="newrec" class="blink" style="color:var(--yellow)" hidden>NEW RECORD!</p>
      <button id="btnRetry">다시 시작</button>
    </div>
    <div class="ov clear" id="clear" hidden>
      <h1 id="clearTitle">STAGE 1<br>CLEAR!</h1>
      <p id="clearSub">SCORE 500</p>
      <button id="btnNext">NEXT</button>
    </div>
  </div>
  <div class="foot">← → / A D · TOUCH · DRAG</div>
</div>

<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W=360,H=540, GROUND=H-34;
  var elLv=document.getElementById('lv'), ovClear=document.getElementById('clear'), elScore=document.getElementById('score'), elHi=document.getElementById('hi'), elLives=document.getElementById('lives');
  var ovStart=document.getElementById('start'), ovOver=document.getElementById('over');
  var elFinal=document.getElementById('final'), elNew=document.getElementById('newrec');

  var hi=0; try{hi=+localStorage.getItem('nyang-hi')||0}catch(e){}
  elHi.textContent=hi;

  /* ---------- 사운드 ---------- */
  var ac=null;
  function beep(f,d,type,v,slide){
    try{
      if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
      o.type=type||'square'; o.frequency.setValueAtTime(f,t);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
      g.gain.setValueAtTime(v||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
    }catch(e){}
  }
  var sfx={
    apple:function(){beep(660,.09,'square',.06,990)},
    gold:function(){beep(880,.08,'square',.06,1320);setTimeout(function(){beep(1320,.18,'square',.06,1760)},80)},
    bomb:function(){beep(180,.4,'sawtooth',.1,40)},
    over:function(){beep(440,.5,'square',.07,110)}
  };

  /* ---------- 상태 ---------- */
  var state='ready', level=1, banner=0, score, lives, items, pops, parts, spawnT, elapsed, shake, flash, last;
  var cat={x:W/2,w:60,h:52,y:GROUND-52,dir:0,target:null,face:0};
  var keys={left:false,right:false};
  var userImg=null;

  var TYPES={
    apple:{pts:10,r:13,speed:1},
    gold:{pts:50,r:13,speed:1.35},
    bomb:{pts:-20,r:13,speed:1.1}
  };

  function reset(){
    score=0; lives=3; level=1; banner=1.5; items=[]; pops=[]; parts=[]; spawnT=0.6; elapsed=0; shake=0; flash=0;
    cat.x=W/2; cat.target=null; cat.face=0;
    hud();
  }
  function hud(){
    elScore.textContent=score; elLv.textContent=level;
    var s=''; for(var i=0;i<3;i++) s+= i<lives ? '♥' : '<span class="off">♥</span>';
    elLives.innerHTML=s;
  }
  function start(){
    reset(); state='play';
    ovStart.hidden=true; ovOver.hidden=true; ovClear.hidden=true; last=performance.now();
    beep(523,.08,'square',.06,784);
  }
  function levelClear(){
    state='clear'; keys.left=keys.right=false; dragging=false;
    document.getElementById('clearTitle').innerHTML='STAGE '+level+'<br>CLEAR!';
    document.getElementById('clearSub').textContent='SCORE '+score;
    ovClear.hidden=false; sfx.gold();
  }
  function next(){
    if(state!=='clear')return;
    level++; items=[]; parts=[]; pops=[]; spawnT=.8; banner=1.5; cat.target=null;
    hud(); ovClear.hidden=true; state='play'; last=performance.now();
    beep(523,.08,'square',.06,784);
  }
  function gameOver(){
    state='over'; sfx.over();
    var rec=score>hi;
    if(rec){hi=score; elHi.textContent=hi; try{localStorage.setItem('nyang-hi',hi)}catch(e){}}
    elFinal.textContent=score; elNew.hidden=!rec; ovOver.hidden=false;
  }

  /* ---------- 입력 ---------- */
  window.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){keys.left=true;cat.target=null;e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){keys.right=true;cat.target=null;e.preventDefault()}
    else if((k==='Enter'||k===' ')&&state!=='play'&&document.activeElement.tagName!=='BUTTON'){(state==='clear'?next():start());e.preventDefault()}
  });
  window.addEventListener('keyup',function(e){
    var k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
    if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
  });
  function px(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
  var dragging=false;
  cv.addEventListener('pointerdown',function(e){dragging=true;try{cv.setPointerCapture(e.pointerId)}catch(_){} cat.target=px(e);e.preventDefault()});
  cv.addEventListener('pointermove',function(e){if(dragging||e.pointerType==='mouse'&&e.buttons)cat.target=px(e)});
  cv.addEventListener('pointerup',function(){dragging=false});
  cv.addEventListener('pointercancel',function(){dragging=false});
  document.getElementById('btnStart').onclick=start;
  document.getElementById('btnRetry').onclick=start;
  document.getElementById('btnNext').onclick=next;
  document.getElementById('file').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){var im=new Image(); im.onload=function(){userImg=im}; im.src=rd.result};
    rd.readAsDataURL(f);
  });

  /* ---------- 스폰 ---------- */
  function spawn(){
    var r=Math.random(), t= r<0.2?'bomb' : r<0.3?'gold' : 'apple';
    var d=TYPES[t];
    
    items.push({t:t,x:24+Math.random()*(W-48),y:-20,r:d.r,vy:(60+(level-1)*40+Math.random()*25)*d.speed,rot:Math.random()*6,vr:(Math.random()-.5)*3});
  }
  function burst(x,y,col,n){
    for(var i=0;i<n;i++){var a=Math.random()*6.28,s=60+Math.random()*120;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5,c:col})}
  }
  function pop(x,y,txt,col){pops.push({x:x,y:y,txt:txt,c:col,life:.8})}

  /* ---------- 업데이트 ---------- */
  function update(dt){
    elapsed+=dt;
    var sp=300;
    if(keys.left)cat.x-=sp*dt, cat.face=-1;
    if(keys.right)cat.x+=sp*dt, cat.face=1;
    if(cat.target!=null){
      var dx=cat.target-cat.x, st=Math.min(Math.abs(dx),620*dt);
      if(Math.abs(dx)>1){cat.x+=Math.sign(dx)*st; cat.face=Math.sign(dx)}
    }
    cat.x=Math.max(cat.w/2,Math.min(W-cat.w/2,cat.x));

    spawnT-=dt;
    if(spawnT<=0){spawn(); spawnT=Math.max(.4,1.4-(level-1)*.15)*(.7+Math.random()*.6)}

    for(var i=items.length-1;i>=0;i--){
      var it=items[i]; it.y+=it.vy*dt; it.rot+=it.vr*dt;
      var top=cat.y+4;
      if(it.y+it.r>=top && it.y-it.r<=cat.y+cat.h && Math.abs(it.x-cat.x)<=cat.w/2+it.r*.4){
        items.splice(i,1); hit(it); if(state!=='play')return; continue;
      }
      if(it.y-it.r>H){items.splice(i,1)}
    }
    for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1)}
    for(i=pops.length-1;i>=0;i--){var q=pops[i];q.life-=dt;q.y-=40*dt;if(q.life<=0)pops.splice(i,1)}
    if(shake>0)shake-=dt; if(flash>0)flash-=dt; if(banner>0)banner-=dt;
  }
  function hit(it){
    if(it.t==='apple'){score+=10;sfx.apple();burst(it.x,it.y,'#ff4d4d',8);pop(it.x,it.y,'+10','#fff6e0')}
    else if(it.t==='gold'){score+=50;sfx.gold();burst(it.x,it.y,'#ffd93d',16);pop(it.x,it.y,'+50','#ffd93d')}
    else{
      score=Math.max(0,score-20); lives--; sfx.bomb(); shake=.35; flash=.25;
      burst(it.x,it.y,'#ff9a3d',22); pop(it.x,it.y,'-20','#ff3d9a');
    }
    hud();
    if(lives<=0)gameOver();
    else if(score>=level*500)levelClear();
  }

  /* ---------- 그리기 ---------- */
  function px4(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}

  var stars=[];for(var s=0;s<40;s++)stars.push([Math.random()*W,Math.random()*(GROUND-40),Math.random()<.3?3:2]);
  function drawBG(t){
    var bands=['#2b0f6b','#3a1486','#4d1a9c','#7a1fa8','#b02c9f','#e24a8d'];
    var bh=GROUND/bands.length;
    for(var i=0;i<bands.length;i++)px4(0,i*bh,W,Math.ceil(bh)+1,bands[i]);
    for(i=0;i<stars.length;i++){
      var st=stars[i]; if(((t*2+i)|0)%5!==0)px4(st[0],st[1],st[2],st[2],'#fff6e0');
    }
    // 레트로 태양
    ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.arc(W-70,GROUND-70,34,0,6.28);ctx.fill();
    ctx.fillStyle='#e24a8d';for(i=0;i<4;i++)ctx.fillRect(W-110,GROUND-60+i*9,80,3+i);
    // 바닥 체크무늬
    for(var x=0;x<W;x+=24){px4(x,GROUND,24,12,(x/24)%2?'#2de2ff':'#1b8fb0')}
    for(x=0;x<W;x+=24){px4(x,GROUND+12,24,22,(x/24)%2?'#7dff5a':'#3fb82a')}
  }
  function drawApple(it,gold){
    var r=it.r;
    ctx.save();ctx.translate(it.x,it.y);
    var c1=gold?'#ffd93d':'#ff3b3b', c2=gold?'#ff9a1f':'#b81d1d';
    ctx.fillStyle=c2;ctx.fillRect(-r,-r+4,r*2,r*2-4);ctx.fillRect(-r+4,-r+2,r*2-8,r*2);
    ctx.fillStyle=c1;ctx.fillRect(-r+2,-r+4,r*2-6,r*2-8);ctx.fillRect(-r+4,-r+2,r*2-10,r*2-4);
    ctx.fillStyle='#fff6e0';ctx.fillRect(-r+5,-r+7,5,5);
    ctx.fillStyle='#5a3418';ctx.fillRect(-1,-r-4,3,7);
    ctx.fillStyle='#4cd137';ctx.fillRect(2,-r-4,8,4);ctx.fillRect(6,-r-2,4,3);
    if(gold){
      var k=(Math.sin(it.rot*3)+1)/2*5+3;
      ctx.fillStyle='#fff6e0';ctx.fillRect(r-2-k/2,-r-k/2,k,2);ctx.fillRect(r-1-1,-r-k/2-0,2,k);
      ctx.fillRect(-r-2,2,6,2);ctx.fillRect(-r+0,0,2,6);
    }
    ctx.restore();
  }
  function drawBomb(it,t){
    var r=it.r;
    ctx.save();ctx.translate(it.x,it.y);
    ctx.fillStyle='#14102a';ctx.fillRect(-r+2,-r+4,r*2-4,r*2-4);ctx.fillRect(-r+4,-r+2,r*2-8,r*2);ctx.fillRect(-r,-r+8,r*2,r*2-12);
    ctx.fillStyle='#3d3866';ctx.fillRect(-r+5,-r+7,5,5);
    ctx.fillStyle='#ddd';ctx.fillRect(-4,-r-2,8,5);
    ctx.fillStyle='#a88';ctx.fillRect(2,-r-8,3,7);ctx.fillRect(4,-r-10,5,3);
    var on=((t*8)|0)%2;
    ctx.fillStyle=on?'#ffd93d':'#ff3d3d';ctx.fillRect(8,-r-14,5,5);
    ctx.fillStyle='#fff6e0';ctx.fillRect(9,-r-13,2,2);
    ctx.fillStyle='#ff3d9a';ctx.fillRect(-6,2,3,3);ctx.fillRect(3,2,3,3);ctx.fillRect(-5,8,10,2);
    ctx.restore();
  }
  function drawCat(t){
    var x=cat.x, y=cat.y;
    if(userImg){
      var s=cat.h+14, ar=userImg.width/userImg.height, w=s*ar, h=s;
      if(w>76){w=76;h=w/ar}
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(userImg,Math.round(x-w/2),Math.round(y+cat.h-h),w,h);
      return;
    }
    var bob=Math.sin(t*10)*((keys.left||keys.right||(cat.target!=null&&Math.abs(cat.target-cat.x)>2))?1.5:0);
    y+=bob;
    var O='#ff9a3d',D='#d9701a',K='#14102a',P='#ff7fb0',Wh='#fff6e0';
    // 꼬리
    px4(x+(cat.face<0?24:-32),y+34,8,8,O);px4(x+(cat.face<0?28:-36),y+26,8,10,O);
    // 몸통
    px4(x-20,y+28,40,24,O);px4(x-20,y+28,40,4,D);
    px4(x-20,y+48,12,6,Wh);px4(x+8,y+48,12,6,Wh);
    // 머리
    px4(x-26,y+4,52,30,O);
    // 귀
    px4(x-26,y-6,10,12,O);px4(x-22,y-2,4,6,P);
    px4(x+16,y-6,10,12,O);px4(x+18,y-2,4,6,P);
    // 줄무늬
    px4(x-4,y+4,8,6,D);px4(x-12,y+4,4,4,D);px4(x+8,y+4,4,4,D);
    // 눈
    var bl=((t*1.3)%3)<.12;
    px4(x-16,y+14,8,bl?2:8,K);px4(x+8,y+14,8,bl?2:8,K);
    if(!bl){px4(x-14,y+16,3,3,Wh);px4(x+10,y+16,3,3,Wh)}
    // 코,입
    px4(x-3,y+24,6,4,P);px4(x-6,y+28,4,2,K);px4(x+2,y+28,4,2,K);
    // 수염
    px4(x-34,y+22,10,2,Wh);px4(x-34,y+28,10,2,Wh);px4(x+24,y+22,10,2,Wh);px4(x+24,y+28,10,2,Wh);
  }
  function render(t){
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
    drawBG(t);
    for(var i=0;i<items.length;i++){var it=items[i];
      if(it.t==='bomb')drawBomb(it,t);else drawApple(it,it.t==='gold')}
    drawCat(t);
    for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life*2);px4(p.x,p.y,4,4,p.c)}
    ctx.globalAlpha=1;
    ctx.font='12px "Press Start 2P",monospace';ctx.textAlign='center';
    for(i=0;i<pops.length;i++){var q=pops[i];ctx.globalAlpha=Math.min(1,q.life*2);
      ctx.fillStyle='#14102a';ctx.fillText(q.txt,q.x+2,q.y+2);ctx.fillStyle=q.c;ctx.fillText(q.txt,q.x,q.y)}
    ctx.globalAlpha=1;
    if(flash>0){ctx.fillStyle='rgba(255,61,154,'+(flash*2)+')';ctx.fillRect(0,0,W,H)}
    ctx.restore();
    if(banner>0&&state==='play'){
      ctx.globalAlpha=Math.min(1,banner*2);ctx.font='18px "Press Start 2P",monospace';ctx.textAlign='center';
      ctx.fillStyle='#14102a';ctx.fillText('LEVEL '+level,W/2+3,H/2+3);ctx.fillStyle='#ffd93d';ctx.fillText('LEVEL '+level,W/2,H/2);ctx.globalAlpha=1;
    }
    // CRT 스캔라인
    ctx.fillStyle='rgba(0,0,0,.12)';for(var y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  }

  function loop(now){
    var dt=Math.min(.05,(now-(last||now))/1000); last=now;
    if(state==='play')update(dt);
    render(now/1000);
    requestAnimationFrame(loop);
  }
  reset(); hud();
  requestAnimationFrame(loop);
})();
</script>

</body></html>
